<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dex Lab: monte seu time, veja fraquezas e cobertura de tipos e compare status. Feito com dados da PokéAPI."
    />
    <title>Dex Lab · montador de time e comparador</title>
    <script>
      // Aplica o tema salvo antes de pintar a página (evita piscar).
      try {
        const t = localStorage.getItem("dexlab:tema");
        if (t === "escuro" || ((!t || t === "sistema") && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
