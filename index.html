    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dex Lab" />
    <meta property="og:title" content="Dex Lab · montador de time e comparador" />
    <meta property="og:description" content="Monte seu time Pokémon, veja fraquezas e cobertura de tipos, compare status e explore a vitrine da comunidade." />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica o tema salvo antes de pintar a página (evita piscar).
      try {
        const t = localStorage.getItem("dexlab:tema");
        if (t === "escuro" || ((!t || t === "sistema") && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
